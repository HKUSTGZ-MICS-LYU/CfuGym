# CFU ISA spec template. Fill and validate before implementation.
spec_version: "1"
identity:
  name: ""
  status: draft            # draft | approved | implemented | validated
  opcode: ""               # custom0 (0x0B); custom1 (0x2B) is rejected by generated intrinsics
  function_id_width: 3     # bus stays 3 bits (funct3)
  subfunction_id_width: 7  # funct7, raw instruction bits 31:25; omitted means 7
  reference_workload: ""

commands:
  # Encoding uniqueness is (function_id, subfunction_id), not function_id alone.
  # Legacy compute/config/load/store use function ids 1/2/4/5, sub-operation 0.
  - function_id: 1
    subfunction_id: 0       # 0..127; omitted means legacy zero
    kind: compute           # compute | control | load | store
    name: ""
    operand: ""
    result: ""
    semantics: ""
    response: value
    # CfuResource declarations: CPU register VALUES, not raw register numbers.
    # Use [] for an acknowledgement-only operation. Omission is legacy mode only.
    resources:
      - {storage: cpu, access: read, role: rs1}
      - {storage: cpu, access: read, role: rs2}
      - {storage: cpu, access: write, role: rd}
    # Vector example (replace the CPU resources, do not blindly append):
    # - {storage: vector, access: read, role: vs1,
    #    index: {source: cpu_value, register: rs1}}
    # - {storage: vector, access: read, role: vs2,
    #    index: {source: cpu_value, register: rs2}}
    # - {storage: vector, access: write, role: vd,
    #    index: {source: cpu_value, register: rs1}}  # explicit in-place write
    # Index alternatives: {source: constant, value: 0}, or compatibility-only
    # {source: legacy_register_number, register: rs1|rs2}. No implicit truncation
    # for cpu_value indices. At most one data write (CPU rd OR vector vd).

# Set to null/[] when the workload is stateless or not applicable.
operations_contract: {}

# Roofline conclusion carried from workload analysis into architecture decisions.
roofline:
  memory_boundary: ""
  operations: ""
  operation_convention: ""
  bytes: ""
  arithmetic_intensity: ""
  compute_peak: {value: "", basis: ""}
  bandwidth_peak: {value: "", basis: ""}
  ridge_point: ""
  predicted_ceiling: ""
  bottleneck: ""
  gap_to_ceiling: ""
  design_action: ""
  verification_metric: ""
  unknowns: []

state:
  register_slots: 0
  cursor_behavior: ""
  reset_behavior: ""

memory:
  operator_owned: false
  bus_width: 0
  load: true
  store: false
  burst: false
  alignment_bytes: 0
  ordering: ""

# Optional generic scaffold dimensions only. No operation, accumulator, storage
# implementation or pipeline is assumed. Concrete designs validate their own
# relationships; algorithm-specific parameters belong in implementation below.
datapath:
  vlen: 0
  xlen: 0
  regDepth: 0
  implementation: {}

software:
  intrinsics_header: ""
  intrinsic_names: []
  scalar_fallback: true
  compiler_march: ""
  soc_flags: []

integration:
  hardware_component: ""
  hardware_fiber: ""
  soc_params: []
  soc_cli_flags: []
  bus_style: TilelinkCfuSpec
  single_cpu_bus_owner: true

validation:
  status: draft
  scalar_reference: false
  soc_simulation: false
  cycle_profile: false
  yosys_cost: false
  requirements: []

assumptions: {}

unknowns: []
