version: "1"

# Visibility tiers gate what the agent may READ. A path matched by a level's
# globs is readable only at that level or above; everything not listed is
# readable at every level. `basic` is the floor and therefore has no entries.
# This is a read-only gate: writes, command allowlists, --apply-patch and
# --dry-run semantics are unchanged.
#
#   basic    - workload/integration/sw plus the AgentCfu surface only;
#              skills and existing sibling CFU designs are hidden.
#   standard - default: basic + skills + sibling CFU designs (Vpu/BitNet).
#   extended - standard + the SpinalHDL source tree, for the isa and
#              implementation stages only.
visibility:
  default: standard
  levels: [basic, standard, extended]
  gated:
    standard:
      - "skills/cfu-designer/**"
      - "src/main/scala/vexiiriscv/soc/mico/VpuCfu.scala"
      - "src/main/scala/vexiiriscv/soc/mico/TilelinkVpuCfuFiber.scala"
      - "src/main/scala/vexiiriscv/soc/mico/BitNetCfu.scala"
      - "src/main/scala/vexiiriscv/soc/mico/BitNetCfuV2.scala"
      - "src/main/scala/vexiiriscv/soc/mico/BitQuant.scala"
      - "src/main/scala/vexiiriscv/soc/mico/TilelinkBitNetCfuFiber.scala"
      - "src/main/scala/vexiiriscv/soc/mico/TilelinkBitNetCfuV2Fiber.scala"
      # Not in any stage read list today; declared so a future stage cannot
      # accidentally expose the BitNet plugin below `standard`.
      - "src/main/scala/vexiiriscv/execute/BitNetPlugin.scala"
    extended:
      - "ext/SpinalHDL/**"

# Deny rules always take precedence over stage allow rules.
deny:
  - ".git/**"
  - "**/.env"
  - "**/.env.*"
  - "**/*secret*"
  - "**/*token*"
  - "**/*password*"
  - "**/*credential*"
  - "**/build/**"
  - "**/target/**"
  - "**/simWorkspace/**"
  - "**/*.elf"
  - "**/*.o"
  - "**/*.a"
  - "**/*.so"
  - "**/*.map"
  - "**/*.vcd"
  - "**/*.fst"

# Hardware design writes are confined to the per-run isolated workspace.
# The tracked AgentCfu.scala / AgentCfuFiber.scala scaffolds are read-only
# defaults; an agent run shadows them via its run workspace overlay. The shared
# AgentCfuLib.scala platform is read-only and is never overlaid, so it cannot be
# replaced or deleted by a run.
write_roots:
  - "agents/generated/runs"
  # Cross-run measurement cache (git-ignored). Only the profile stage uses it.
  - "agents/generated/cache"
  - "sw/tests"

stages:
  load_context:
    read:
      - "agents/specs/agent_access_policy.yaml"
      - "agents/specs/cfu_isa_template.yaml"
      - "skills/cfu-designer/SKILL.md"
      - "skills/cfu-designer/references/**"
      - "src/main/scala/vexiiriscv/execute/cfu/CfuBus.scala"
      - "src/main/scala/vexiiriscv/execute/cfu/CfuPlugin.scala"
      - "src/main/scala/vexiiriscv/soc/cfu/**"
      - "src/main/scala/vexiiriscv/soc/mico/**"
      - "benchmarks/embench-iot/src/**"
      - "benchmarks/embench-iot/support/**"
      - "sw/embench/**"
      - "sw/MiCo-Lib/targets/vexii_soc/**"
      - "sw/tests/**"
    write:
      - "agents/generated/runs/**/01_context/**"
      - "agents/generated/runs/**/run.yaml"
    commands: [git_status]
  ingest_input:
    read:
      - "agents/specs/cfu_isa_template.yaml"
      - "agents/specs/*.spec"
      - "agents/specs/*.yaml"
      - "agents/examples/**"
      - "benchmarks/embench-iot/src/**"
      - "benchmarks/embench-iot/support/**"
      - "sw/embench/**"
      - "src/main/scala/vexiiriscv/soc/cfu/**"
      - "src/main/scala/vexiiriscv/soc/mico/**"
      - "sw/tests/**"
    write:
      - "agents/generated/runs/**/02_workload/**"
      - "agents/generated/runs/**/run.yaml"
    commands: []
  route_input:
    read: ["agents/generated/runs/**/02_workload/**"]
    write:
      - "agents/generated/runs/**/03_route/**"
      - "agents/generated/runs/**/run.yaml"
    commands: []
  prepare_benchmark:
    read:
      - "agents/generated/runs/**/02_workload/**"
      - "agents/generated/runs/**/03_route/**"
      # Instrumentation reads the run's own project copy after copying it.
      - "agents/generated/runs/**/workspace/**"
      - "agents/examples/**"
      - "benchmarks/embench-iot/src/**"
      - "benchmarks/embench-iot/support/**"
      - "sw/embench/**"
      - "sw/tests/**"
    write:
      - "agents/generated/runs/**/04_benchmark/**"
      - "agents/generated/runs/**/workspace/**"
      - "agents/generated/runs/**/run.yaml"
    commands: []
  profile:
    read:
      - "agents/generated/runs/**/02_workload/**"
      - "agents/generated/runs/**/04_benchmark/**"
      - "agents/generated/runs/**/workspace/**"
      - "agents/generated/cache/**"
      - "benchmarks/embench-iot/src/**"
      - "sw/embench/**"
    write:
      - "agents/generated/runs/**/05_profile/**"
      - "agents/generated/runs/**/workspace/**"
      - "agents/generated/runs/**/run.yaml"
      - "agents/generated/cache/**"
    commands: [make_profile, project_test, embench_build, soc_sim]
  hotspot:
    read:
      - "agents/generated/runs/**/02_workload/**"
      - "agents/generated/runs/**/04_benchmark/**"
      - "agents/generated/runs/**/05_profile/**"
    write:
      - "agents/generated/runs/**/06_hotspot/**"
      - "agents/generated/runs/**/run.yaml"
    commands: []
  analysis:
    read:
      - "agents/generated/runs/**/02_workload/**"
      - "agents/generated/runs/**/06_hotspot/**"
      - "agents/generated/runs/**/07_analysis/ir/**"
      # The profile build's disassembly, so the analysis can read the real
      # instructions of the hot loop instead of inferring them from C.
      - "agents/generated/runs/**/workspace/**/*.asm"
      - "benchmarks/embench-iot/src/**"
      - "benchmarks/embench-iot/support/**"
      - "skills/cfu-designer/SKILL.md"
      - "skills/cfu-designer/references/acceleration-patterns.md"
      - "skills/cfu-designer/references/roofline-analysis.md"
      - "skills/cfu-designer/references/u8-weighted-average-experiment.md"
      - "skills/cfu-designer/references/vector-rf-vpu-pattern.md"
      - "src/main/scala/vexiiriscv/execute/cfu/CfuBus.scala"
      - "src/main/scala/vexiiriscv/execute/cfu/CfuPlugin.scala"
      - "src/main/scala/vexiiriscv/soc/cfu/**"
      - "src/main/scala/vexiiriscv/soc/mico/**"
      - "sw/tests/**"
    write:
      - "agents/generated/runs/**/07_analysis/**"
      - "agents/generated/runs/**/run.yaml"
    commands: []
  isa:
    read:
      - "agents/generated/runs/**/02_workload/**"
      - "agents/generated/runs/**/06_hotspot/**"
      - "agents/generated/runs/**/07_analysis/**"
      - "agents/specs/cfu_isa_template.yaml"
      - "skills/cfu-designer/references/vexii-cfu-methodology.md"
      - "skills/cfu-designer/references/vector-rf-vpu-pattern.md"
      - "src/main/scala/vexiiriscv/execute/cfu/CfuBus.scala"
      - "src/main/scala/vexiiriscv/execute/cfu/CfuPlugin.scala"
      - "src/main/scala/vexiiriscv/soc/cfu/**"
      - "src/main/scala/vexiiriscv/soc/mico/**"
      - "sw/MiCo-Lib/targets/vexii_soc/custom_asm.h"
      - "sw/tests/**"
      # Same reasoning as the implementation stage: the workload source shown in
      # the context must stay readable when the ISA contract is drafted.
      - "benchmarks/embench-iot/src/**"
      - "benchmarks/embench-iot/support/**"
      # SpinalHDL syntax/API is only exposed at the `extended` visibility level
      # (see the `visibility` section); it is never pre-read into the prompt.
      - "ext/SpinalHDL/**"
    write:
      - "agents/generated/runs/**/08_isa/**"
      - "agents/generated/runs/**/run.yaml"
    commands: []
  implementation:
    read:
      - "agents/generated/runs/**/02_workload/**"
      - "agents/generated/runs/**/07_analysis/**"
      - "agents/generated/runs/**/08_isa/**"
      - "agents/generated/runs/**/workspace/design/**"
      # Software rung targets: the accelerated kernel lives in the run workspace.
      - "agents/generated/runs/**/workspace/embench_*/cfu/**"
      - "agents/generated/runs/**/workspace/*_benchmark/**"
      - "agents/generated/runs/**/workspace/*_project_profile/**"
      - "agents/examples/**"
      # The workload source is shown in the prompt context at load_context, so
      # it must also be readable here: otherwise the tool loop is denied a file
      # the model can already see.
      - "benchmarks/embench-iot/src/**"
      - "benchmarks/embench-iot/support/**"
      - "skills/cfu-designer/assets/templates/**"
      - "src/main/scala/vexiiriscv/execute/cfu/**"
      - "src/main/scala/vexiiriscv/soc/cfu/**"
      - "src/main/scala/vexiiriscv/soc/mico/**"
      - "sw/MiCo-Lib/targets/vexii_soc/**"
      - "sw/tests/**"
      # SpinalHDL syntax/API is only exposed at the `extended` visibility level
      # (see the `visibility` section); it is never pre-read into the prompt.
      - "ext/SpinalHDL/**"
    write:
      - "agents/generated/runs/**/09_implementation/**"
      - "agents/generated/runs/**/run.yaml"
      # Only these two files may carry agent hardware design changes.
      - "agents/generated/runs/**/workspace/design/AgentCfu.scala"
      - "agents/generated/runs/**/workspace/design/AgentCfuFiber.scala"
      # The accelerated software lives in the workload's run workspace copy.
      - "agents/generated/runs/**/workspace/embench_*/cfu/**"
      - "agents/generated/runs/**/workspace/*_benchmark/**"
      - "agents/generated/runs/**/workspace/*_project_profile/**"
      - "sw/tests/**"
    commands: [git_apply_check, git_apply]
  # Hardware conformance: a harness-generated differential micro-test of the new
  # instructions, run between the SoC build and the software rung. The C test is
  # produced by the harness (never a model write target); only its oracle and the
  # build products live in the run workspace.
  conformance:
    read:
      - "agents/generated/runs/**/02_workload/**"
      - "agents/generated/runs/**/08_isa/**"
      - "agents/generated/runs/**/09_implementation/**"
      - "agents/generated/runs/**/10_validation/**"
      - "agents/generated/runs/**/workspace/**"
      - "sw/MiCo-Lib/**"
      - "src/main/scala/vexiiriscv/execute/cfu/**"
      - "src/main/scala/vexiiriscv/soc/cfu/**"
      - "src/main/scala/vexiiriscv/soc/mico/**"
    write:
      - "agents/generated/runs/**/09_implementation/**"
      - "agents/generated/runs/**/run.yaml"
      # The generated intrinsics header lives beside the workload software.
      - "agents/generated/runs/**/workspace/embench_*/cfu/**"
      - "agents/generated/runs/**/workspace/*_benchmark/**"
      - "agents/generated/runs/**/workspace/*_project_profile/**"
    commands: [conformance_build, soc_sim]
  validation:
    read:
      - "agents/generated/runs/**/02_workload/**"
      - "agents/generated/runs/**/04_benchmark/**"
      - "agents/generated/runs/**/06_hotspot/**"
      - "agents/generated/runs/**/07_analysis/**"
      - "agents/generated/runs/**/08_isa/**"
      - "agents/generated/runs/**/09_implementation/**"
      - "agents/generated/runs/**/workspace/**"
      - "benchmarks/embench-iot/src/**"
      - "sw/embench/**"
      - "src/main/scala/vexiiriscv/soc/mico/**"
      - "src/main/scala/vexiiriscv/soc/cfu/**"
      - "sw/tests/**"
    write:
      - "agents/generated/runs/**/10_validation/**"
      - "agents/generated/runs/**/workspace/**"
      - "agents/generated/runs/**/run.yaml"
    commands: [make_profile, project_test, embench_build, soc_generate_agent, soc_sim]
  cost:
    read:
      - "agents/generated/runs/**/08_isa/**"
      - "agents/generated/runs/**/09_implementation/**"
      - "agents/generated/runs/**/10_validation/**"
      - "agents/generated/runs/**/workspace/**"
      - "MiCoSoc.v"
    write:
      - "agents/generated/runs/**/11_cost/**"
      - "agents/generated/runs/**/workspace/**"
      - "agents/generated/runs/**/run.yaml"
    commands: [cfu_generate_agent, yosys_cost]
  review:
    read: ["agents/generated/runs/**/**"]
    write: ["agents/generated/runs/**/12_review/**", "agents/generated/runs/**/report.md", "agents/generated/runs/**/run.yaml"]
    commands: []

commands:
  git_status:
    executable: git
    argv_prefix: [git, status, --short]
  make_profile:
    executable: make
    required_tokens: [TARGET=vexii_soc]
  project_test:
    executable: make
    required_tokens: [TARGET=vexii_soc]
  # Embench build: the sw Makefile's EXTRA_* hooks carry the benchmark sources.
  embench_build:
    executable: make
    required_tokens: [TARGET=vexii_soc]
    required_substrings: ["EXTRA_SOURCES="]
    priority: 10
  # Hardware conformance micro-test build: the same make shape as a benchmark build,
  # but it must name the harness-owned test so a benchmark build cannot stand in.
  conformance_build:
    executable: make
    required_tokens: [TARGET=vexii_soc]
    required_substrings: ["cfu_conformance"]
    priority: 10
  soc_generate:
    executable: sbt
    required_substring: "runMain vexiiriscv.soc.mico.MiCoSocGen"
  # Overlay generation: compiles the run workspace design on top of the repo
  # scaffold by shadowing the tracked AgentCfu*.scala files.
  soc_generate_agent:
    executable: sbt
    required_substring: "runMain vexiiriscv.soc.mico.MiCoSocGen"
    required_substrings: ["--mico-agent-cfu"]
    priority: 10
  soc_sim:
    executable: sbt
    required_substring: "runMain vexiiriscv.soc.mico.MiCoSocSim"
  # Standalone CFU generation: GenAgentCfu elaborates ONLY the overlaid
  # AgentCfu class, so the cost rung can synthesize the agent CFU in isolation
  # instead of the whole SoC. Keeping it a separate declaration (rather than
  # widening soc_generate_agent) makes the "cost runs without a CPU" property
  # explicit in the policy.
  cfu_generate_agent:
    executable: sbt
    required_substring: "runMain vexiiriscv.soc.mico.GenAgentCfu"
    required_substrings: ["--out-dir"]
    priority: 10
  yosys_cost:
    executable: python3
    argv_prefix: [python3, skills/cfu-designer/scripts/yosys_cost_report.py]
  # Retain the legacy descriptor for compatibility. RepoToolbox validates all
  # text-patch targets and strips --unsafe-paths before invoking Git; ignored
  # workspace paths do not require unsafe path execution.
  git_apply_check:
    executable: git
    argv_prefix: [git, apply, --check, -, --unsafe-paths]
  git_apply:
    executable: git
    argv_prefix: [git, apply, -, --unsafe-paths]
